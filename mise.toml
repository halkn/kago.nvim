[tools]
neovim = "stable"
stylua = "latest"
# Runtime dependencies of the modules under test, so the suite also runs on a bare runner.
ripgrep = "latest"
fd = "latest"

[tool_alias]
emmylua_check = "github:EmmyLuaLs/emmylua-analyzer-rust"

[tools.emmylua_check]
version = "latest"
matching = "emmylua_check"
rename_exe = "emmylua_check"

[tasks.fmt]
description = "ファイル整形"
run = "stylua ."

[tasks.fmt-check]
description = "整形チェック（書き換えなし）"
run = "stylua --check ."

[tasks.lint]
description = "Lua の静的解析"
run = """
VIMRUNTIME="$(NVIM_LOG_FILE=/dev/null nvim --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME)' +q 2>/dev/null)" \\
  emmylua_check --warnings-as-errors --ignore '.deps/**' .
"""

[tasks.test-deps]
description = "テスト専用の plenary.nvim を固定 commit で取得"
run = "sh tests/deps.sh"

[tasks.test]
description = "Plenary/Busted の機能・回帰テスト（任意で spec のパスを指定）"
depends = ["test-deps"]
run = "NVIM_LOG_FILE=/dev/null nvim --headless -n -i NONE -u tests/minimal_init.lua -l tests/run.lua"

[tasks.check]
description = "リポジトリ検証（整形チェック・静的解析・テスト）"
depends = ["fmt-check", "lint", "test"]
