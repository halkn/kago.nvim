name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      # A bare runner has none of the user's dotfiles, so this run also checks that
      # the suite stands on its own.
      - run: mise run check
