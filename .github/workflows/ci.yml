name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  KAGO_TEST_REQUIRE_PTY: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      # A bare runner has none of the user's dotfiles, so this run also checks that
      # the suite stands on its own.
      - run: mise run check

  test-minimum-neovim:
    runs-on: ubuntu-latest
    env:
      MISE_NEOVIM_VERSION: 0.12.0
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: nvim --version
      - run: mise run test
